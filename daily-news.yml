name: Daily Auto News Publisher

on:
  schedule:
    # Runs automatically every day at 08:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run news generation script
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python auto_fetch.py

      - name: Commit and Push new post to GitHub
        run: |
          git config --global user.name 'News Automation Bot'
          git config --global user.email 'bot@chimo.com'
          git add content/posts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: publish daily breaking news" && git push)