<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chimo - News & Video Platform</title>

  <!-- Google Analytics Tag -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LKHWTFJTTL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LKHWTFJTTL');
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml/dist/js-yaml.min.js"></script>
</head>
<body class="bg-[#F8F6F0] text-[#1A1A1A] font-sans">

  <!-- TOP FEATURED MOVIE SECTION -->
  <header class="max-w-6xl mx-auto p-4">
    <h1 class="text-3xl font-bold tracking-tight mb-2">Chimo</h1>
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6">
      <span class="bg-red-100 text-red-600 text-xs font-semibold px-2.5 py-1 rounded-full uppercase">Featured Highlight</span>
      <h2 class="text-2xl font-bold mt-2">Top 5 Movies to Watch this weekend</h2>
      <p class="text-gray-600 text-sm mt-1">Spider-Man: Brand New Day - Peter Parker faces mounting pressure as a dangerous threat emerges.</p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4">

    <!-- BREAKING NEWS SLIDER SECTION (Circled in Black) -->
    <section class="mb-8">
      <div id="breaking-banner-bg" class="bg-[#8B3A2B] text-white p-6 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-6 transition-all duration-500 ease-in-out">
        <div class="flex-1">
          <span class="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Breaking News</span>
          <h3 id="breaking-banner-title" class="text-xl md:text-2xl font-bold mt-3 leading-snug">
            Loading latest breaking updates...
          </h3>
          <p id="breaking-banner-excerpt" class="text-gray-200 text-sm mt-2 line-clamp-2">
            Fetching today's stories...
          </p>
          <a id="breaking-banner-link" href="#" target="_blank" class="inline-block mt-4 bg-white text-[#8B3A2B] font-bold px-5 py-2 rounded-full text-sm hover:bg-gray-100 transition">
            Read Full Story &rarr;
          </a>
        </div>
        <div class="w-full md:w-1/3">
          <img id="breaking-banner-img" src="https://via.placeholder.com/400x250" alt="News Image" class="w-full h-48 object-cover rounded-xl shadow-md" />
        </div>
      </div>
    </section>

    <!-- LATEST FEED SECTION (Circled in Green) -->
    <section>
      <h3 class="text-xl font-bold mb-4">Latest Feed</h3>
      <div id="latest-feed-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Markdown posts will load here dynamically -->
      </div>
    </section>

  </main>

  <!-- JAVASCRIPT: FETCH POSTS & AUTOMATE THE SLIDER -->
  <script>
    let allPosts = [];
    let currentSlideIndex = 0;

    // Load Markdown files from GitHub repository
    async function loadPosts() {
      try {
        // List of markdown files generated by Python script
        const response = await fetch('https://api.github.com/repos/Chimo-byte/chimo-website/contents/content/posts');
        const files = await response.json();

        if (Array.isArray(files)) {
          const markdownFiles = files.filter(file => file.name.endsWith('.md')).reverse();

          for (const file of markdownFiles) {
            const res = await fetch(file.download_url);
            const text = await res.text();
            
            // Parse frontmatter YAML
            const parts = text.split('---');
            if (parts.length >= 3) {
              const meta = jsyaml.load(parts[1]);
              const body = parts.slice(2).join('---');
              allPosts.push({ ...meta, body, fileUrl: file.html_url });
            }
          }

          if (allPosts.length > 0) {
            initBreakingNewsSlider();
            renderLatestFeed();
          }
        }
      } catch (err) {
        console.error("Error loading posts:", err);
      }
    }

    // Rotates the Breaking News banner through ALL daily posts (every 5 seconds)
    function initBreakingNewsSlider() {
      updateBanner();
      setInterval(() => {
        currentSlideIndex = (currentSlideIndex + 1) % allPosts.length;
        updateBanner();
      }, 5000);
    }

    function updateBanner() {
      const post = allPosts[currentSlideIndex];
      document.getElementById('breaking-banner-title').textContent = post.title || "Latest Headline";
      document.getElementById('breaking-banner-excerpt').textContent = post.excerpt || "";
      document.getElementById('breaking-banner-img').src = post.thumbnail || "https://via.placeholder.com/400x250";
      
      // Extract original link or default to file
      const linkMatch = post.body.match(/href="([^"]+)"/);
      document.getElementById('breaking-banner-link').href = linkMatch ? linkMatch[1] : "#";
    }

    // Renders all daily posts below in the Latest Feed grid
    function renderLatestFeed() {
      const container = document.getElementById('latest-feed-grid');
      container.innerHTML = allPosts.map(post => `
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 p-4">
          <img src="${post.thumbnail || 'https://via.placeholder.com/400x200'}" class="w-full h-40 object-cover rounded-xl mb-3" />
          <span class="text-xs font-semibold uppercase text-gray-500">${post.category || 'News'}</span>
          <h4 class="font-bold text-lg mt-1 line-clamp-2">${post.title}</h4>
          <p class="text-gray-600 text-sm mt-2 line-clamp-3">${post.excerpt || ''}</p>
        </div>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', loadPosts);
  </script>
</body>
</html>
